# /etc/nginx/sites-available/hcis  — melayani aplikasi lewat IP publik (tanpa domain).
# Setelah ada HTTPS (certbot --nginx) blok ini diubah otomatis oleh certbot.
server {
    listen 80 default_server;
    server_name _;                     # ganti dengan domain / xxx.sslip.io bila sudah ada

    # file unggahan maks 10 MB (+ ruang untuk form)
    client_max_body_size 12m;

    root /var/www/dea-core-hcis/frontend/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # keamanan dasar (HSTS sengaja TIDAK dipasang selama masih HTTP)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    server_tokens off;

    # React (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }
    # aset berhash dari Vite: cache lama
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
    # index.html jangan di-cache agar rilis baru langsung terpakai
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # API → backend Go
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
