services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dea_hcis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: dea_hcis
      DB_PORT: 5432
      JWT_SECRET: change-this-in-production
      PORT: 8080
      UPLOAD_DIR: /data/uploads
      # Google Drive sync (see backend/.env.example); values come from your shell or a .env next to this file
      GDRIVE_ENABLED: ${GDRIVE_ENABLED:-false}
      GDRIVE_CLIENT_ID: ${GDRIVE_CLIENT_ID:-}
      GDRIVE_CLIENT_SECRET: ${GDRIVE_CLIENT_SECRET:-}
      GDRIVE_REDIRECT_URL: ${GDRIVE_REDIRECT_URL:-http://localhost:8080/api/drive/callback}
      GDRIVE_ROOT_FOLDER_ID: ${GDRIVE_ROOT_FOLDER_ID:-}
    volumes:
      - uploads:/data/uploads
    depends_on:
      - postgres

volumes:
  pgdata:
  uploads:
